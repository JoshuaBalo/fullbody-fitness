<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FullBody Fitness</title>


  <!--Citation: 
  Bootstrap 5.3.3 framework (Bootstrap Team, 2024)
  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- If you're using Bootstrap 5, add its stylesheet link here, above your own stylesheet. -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before the page paints, so there is no light flash in dark mode
    (function () {
      try {
        var saved = localStorage.getItem("fullbodyTheme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    })();
  </script>
</head>
 

<body>

  <header id="banner">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">FullBody Fitness</a>

        <button class="btn btn-outline-light btn-sm ms-auto me-2" type="button" id="themeToggleBtn" aria-label="Toggle dark mode">🌙 Dark</button>

        <button class="navbar-toggler" type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#fitnessNav" 
          aria-controls="fitnessNav" 
          aria-expanded="false" 
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="fitnessNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Exercises</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="routine.html">Routine</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="progress.html">Progress</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main id="pg-main-content" class="container my-5">

    <section class="row justify-content-center mb-5">
      <div class="col-12 col-md-8 col-lg-6 text-center">
        <h1 class="display-6 fw-bold mb-3">Explore Exercises</h1>
        <p class="text-muted mb-4">Search by the movement name or target muscle group</p>
        
        <div class="input-group">
          <input 
            type="search" 
            id="searchInput" 
            class="form-control form-control-lg" 
            placeholder="e.g. Press, Squat, Curl..." 
            aria-label="Search exercises">
          <button class="btn btn-primary px-4" type="button" id="searchBtn">Search</button>
        </div>
      </div>
    </section>

    <div id="routineAddedToast" class="alert alert-success text-center d-none" role="alert">
      Added to your routine. <a href="routine.html" class="alert-link">View Routine</a>
    </div>

    <section id="errorAlert" class="alert alert-danger text-center d-none" role="alert">
    </section>

    <section class="row g-4" id="exerciseContainer">
    </section>

    <section id="favouritesSection" class="mt-5 pt-5 border-top">
      <h2 class="h3 fw-bold mb-3">Saved Favourites</h2>
      <div class="row g-4" id="favouritesContainer">
        <p class="text-muted" id="emptyFavouritesMsg">You have not favorited any exercises yet.</p>
      </div>
    </section>
  </main>

  <footer id="pg-footer" class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0">&copy; 2026 CSCI 2170 | FullBody Fitness </p>
  </footer>

  <!-- Exercise details popup -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailsModalLabel">Exercise Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="detailsCategory" class="text-muted"></p>
          <p id="detailsMuscles" class="text-muted small"></p>
          <p id="detailsEquipment" class="text-muted small"></p>
          <p id="detailsDescription"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- If you're using Bootstrap 5's JavaScript, add its script tag here, above your own script. -->
  <script src="js/app.js"></script>
</body>

</html>
